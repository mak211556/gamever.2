<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethelgard: The Lost Solstice</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 2px solid #3a3225;
            border-radius: 4px;
            overflow: hidden;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>

<div id="game-container"></div>

<script>
// ============================================================================
// AUDIO MANAGER (Procedural WebAudio Synthesizer)
// ============================================================================
class AudioSynthesizer {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }

    playJumpSFX() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
    }

    playStepSFX() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(80, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
    }

    playRelicSFX() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.08);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.08 + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.08);
            osc.stop(this.ctx.currentTime + idx * 0.08 + 0.2);
        });
    }

    playSwitchSFX() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, this.ctx.currentTime);
        osc.frequency.setValueAtTime(100, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
    }
}

const audioSynth = new AudioSynthesizer();

// ============================================================================
// BOOT & PROCEDURAL ASSET GENERATION SCENE
// ============================================================================
class BootScene extends Phaser.Scene {
    constructor() { super('BootScene'); }

    create() {
        this.generateGraphics();
        this.scene.start('MainMenuScene');
    }

    generateGraphics() {
        // Build Player Spritesheet Dynamics
        const g = this.add.graphics();

        // 1. Player Sprite Frame (24x32)
        g.clear();
        // Body (Explorer tunic)
        g.fillStyle(0x20b2aa, 1); // Turquoise
        g.fillRoundedRect(4, 8, 16, 20, 4);
        // Head
        g.fillStyle(0xe0ac69, 1); // Skin tone
        g.fillCircle(12, 8, 6);
        // Scarf/Accents
        g.fillStyle(0xffd700, 1); // Gold accent
        g.fillRect(6, 12, 12, 3);
        g.generateTexture('player_idle', 24, 32);

        // 2. Player Running Frame
        g.clear();
        g.fillStyle(0x20b2aa, 1);
        g.fillRoundedRect(2, 8, 18, 18, 4);
        g.fillStyle(0xe0ac69, 1);
        g.fillCircle(14, 7, 6);
        g.fillStyle(0xffd700, 1);
        g.fillRect(4, 12, 14, 3);
        g.generateTexture('player_run', 24, 32);

        // 3. Environment Tiles
        // Ground Tile
        g.clear();
        g.fillStyle(0x3a3225, 1); // Sandstone Dark
        g.fillRect(0, 0, 32, 32);
        g.fillStyle(0x5c4d37, 1);
        g.fillRect(2, 2, 28, 28);
        g.fillStyle(0xffd700, 0.3);
        g.fillRect(4, 4, 8, 8);
        g.generateTexture('tile_ground', 32, 32);

        // Moving Platform
        g.clear();
        g.fillStyle(0x20b2aa, 1);
        g.fillRoundedRect(0, 0, 64, 16, 4);
        g.fillStyle(0xffd700, 1);
        g.fillRect(8, 4, 48, 8);
        g.generateTexture('moving_platform', 64, 16);

        // Relic / Collectible
        g.clear();
        g.fillStyle(0xffd700, 1);
        g.fillTriangle(12, 0, 24, 24, 0, 24);
        g.fillStyle(0x20b2aa, 1);
        g.fillCircle(12, 14, 4);
        g.generateTexture('relic', 24, 24);

        // Pressure Switch
        g.clear();
        g.fillStyle(0x888888, 1);
        g.fillRect(0, 8, 32, 8);
        g.fillStyle(0xff2200, 1);
        g.fillRect(6, 4, 20, 4);
        g.generateTexture('switch_off', 32, 16);

        g.clear();
        g.fillStyle(0x888888, 1);
        g.fillRect(0, 8, 32, 8);
        g.fillStyle(0x00ffcc, 1);
        g.fillRect(6, 7, 20, 2);
        g.generateTexture('switch_on', 32, 16);

        // Door Barrier
        g.clear();
        g.fillStyle(0xffd700, 0.8);
        g.fillRect(0, 0, 16, 64);
        g.fillStyle(0x20b2aa, 0.9);
        g.fillRect(4, 4, 8, 56);
        g.generateTexture('door', 16, 64);

        // Checkpoint Pillar
        g.clear();
        g.fillStyle(0x5c4d37, 1);
        g.fillRect(4, 0, 16, 48);
        g.fillStyle(0xffd700, 1);
        g.fillCircle(12, 10, 6);
        g.generateTexture('checkpoint', 24, 48);

        // Background Decorative Pillar
        g.clear();
        g.fillStyle(0x1a1610, 0.6);
        g.fillRect(0, 0, 40, 300);
        g.fillStyle(0x2b241a, 0.6);
        g.fillRect(5, 0, 30, 300);
        g.generateTexture('bg_pillar', 40, 300);
    }
}

// ============================================================================
// MAIN MENU SCENE
// ============================================================================
class MainMenuScene extends Phaser.Scene {
    constructor() { super('MainMenuScene'); }

    create() {
        const { width, height } = this.scale;

        // Cinematic Background Gradient
        const bg = this.add.graphics();
        bg.fillGradientStyle(0x0d0f12, 0x0d0f12, 0x1f1a14, 0x1f1a14, 1);
        bg.fillRect(0, 0, width, height);

        // Game Title
        this.add.text(width / 2, height / 3, 'AETHELGARD', {
            fontSize: '56px',
            fontStyle: 'bold',
            color: '#ffd700',
            letterSpacing: 6
        }).setOrigin(0.5);

        this.add.text(width / 2, height / 3 + 60, 'THE LOST SOLSTICE', {
            fontSize: '20px',
            color: '#20b2aa',
            letterSpacing: 4
        }).setOrigin(0.5);

        // Play Button Prompt
        const startText = this.add.text(width / 2, height / 1.5, 'PRESS SPACE OR CLICK TO START', {
            fontSize: '18px',
            color: '#ffffff'
        }).setOrigin(0.5);

        // Controls Box
        const info = this.add.text(width / 2, height - 80, 
            'Controls: [A/D] or [←/→] Move | [SPACE/W] Jump | [SHIFT] Roll | [S/↓] Crouch\nWall Jump: Jump while sliding on a wall', {
            fontSize: '14px',
            color: '#a0a0a0',
            align: 'center'
        }).setOrigin(0.5);

        // Pulsing Start Text Animation
        this.tweens.add({
            targets: startText,
            alpha: 0.2,
            duration: 800,
            yoyo: true,
            loop: -1
        });

        // Event Listeners for Transition
        this.input.keyboard.once('keydown-SPACE', () => this.startGame());
        this.input.on('pointerdown', () => this.startGame());
    }

    startGame() {
        this.scene.start('LevelScene');
    }
}

// ============================================================================
// LEVEL SCENE (Core Gameplay)
// ============================================================================
class LevelScene extends Phaser.Scene {
    constructor() { super('LevelScene'); }

    create() {
        this.cameras.main.setBackgroundColor('#0d0f12');

        // State & Progression
        this.currentArea = 1;
        this.relicsCollected = 0;
        this.totalRelics = 4;
        this.respawnPoint = { x: 80, y: 400 };

        // Create Groups
        this.platforms = this.physics.add.staticGroup();
        this.movingPlatforms = this.physics.add.group();
        this.relics = this.physics.add.staticGroup();
        this.switches = this.physics.add.staticGroup();
        this.doors = this.physics.add.staticGroup();
        this.checkpoints = this.physics.add.staticGroup();
        this.hazards = this.physics.add.staticGroup();

        // Build Multi-Area Map
        this.buildWorld();

        // Spawn Player
        this.createPlayer();

        // Collisions & Triggers
        this.physics.add.collider(this.player, this.platforms);
        this.physics.add.collider(this.player, this.movingPlatforms, this.handleMovingPlatform, null, this);
        this.physics.add.collider(this.player, this.doors);
        this.physics.add.overlap(this.player, this.relics, this.collectRelic, null, this);
        this.physics.add.overlap(this.player, this.switches, this.activateSwitch, null, this);
        this.physics.add.overlap(this.player, this.checkpoints, this.reachCheckpoint, null, this);
        this.physics.add.overlap(this.player, this.hazards, this.playerDeath, null, this);

        // Camera Tracking
        this.cameras.main.startFollow(this.player, true, 0.08, 0.08);
        this.cameras.main.setBounds(0, 0, 3800, 800);

        // Controls Setup
        this.cursors = this.input.keyboard.createCursorKeys();
        this.keys = this.input.keyboard.addKeys({
            a: Phaser.Input.Keyboard.KeyCodes.A,
            d: Phaser.Input.Keyboard.KeyCodes.D,
            w: Phaser.Input.Keyboard.KeyCodes.W,
            s: Phaser.Input.Keyboard.KeyCodes.S,
            shift: Phaser.Input.Keyboard.KeyCodes.SHIFT
        });

        // UI Overlay
        this.createUI();

        // Dynamic Lighting Effect Ambient Light
        this.ambientLight = this.add.graphics();
        this.ambientLight.fillStyle(0x000000, 0.15);
        this.ambientLight.fillRect(0, 0, 3800, 800);
    }

    buildWorld() {
        // Background Aesthetics
        for (let x = 100; x < 3600; x += 300) {
            this.add.image(x, 450, 'bg_pillar').setDepth(0);
        }

        // GROUND FLOOR & STRUCTURE
        // Area 1: Ancient Ruins (X: 0 - 900)
        this.createPlatformRect(0, 550, 28, 3); // Main Entrance floor
        this.createPlatformRect(300, 420, 6, 1);
        this.createPlatformRect(550, 320, 8, 1);
        this.relics.create(650, 270, 'relic');

        // Moving platform bridging Area 1 & 2
        const mp1 = this.movingPlatforms.create(850, 480, 'moving_platform');
        mp1.setImmovable(true);
        mp1.body.allowGravity = false;
        this.tweens.add({
            targets: mp1,
            x: 1100,
            duration: 3000,
            yoyo: true,
            repeat: -1,
            ease: 'Sine.easeInOut'
        });

        // Area 2: Underground Temple (X: 1000 - 1900)
        this.createPlatformRect(1150, 550, 20, 3);
        this.createPlatformRect(1350, 420, 4, 1);
        
        // Puzzle 1: Switch & Barrier Door
        const sw1 = this.switches.create(1200, 520, 'switch_off');
        sw1.id = 'door1';
        sw1.activated = false;
        
        const d1 = this.doors.create(1600, 486, 'door');
        d1.id = 'door1';

        this.createPlatformRect(1620, 550, 15, 3);
        this.relics.create(1700, 500, 'relic');

        // Checkpoint 1
        this.checkpoints.create(1250, 502, 'checkpoint');

        // Area 3: Forgotten City (X: 2000 - 2800)
        this.createPlatformRect(2000, 550, 8, 1);
        this.createPlatformRect(2200, 450, 6, 1);
        this.createPlatformRect(2400, 350, 6, 1);

        // Hazards Section
        const hazardG = this.add.graphics();
        hazardG.fillStyle(0xff2200, 0.6);
        hazardG.fillRect(2000, 580, 800, 20);
        const hazardZone = this.add.zone(2400, 580, 800, 20);
        this.physics.add.existing(hazardZone, true);
        this.hazards.add(hazardZone);

        // Vertical Wall Climb Section
        this.createPlatformRect(2650, 200, 2, 10);
        this.relics.create(2600, 150, 'relic');

        // Checkpoint 2
        this.checkpoints.create(2050, 502, 'checkpoint');

        // Area 4: Final Sanctuary (X: 2900 - 3600)
        this.createPlatformRect(2900, 550, 25, 3);
        
        // Final Puzzle: Dual Switch System
        const sw2 = this.switches.create(3000, 520, 'switch_off');
        sw2.id = 'door2';
        sw2.activated = false;

        const d2 = this.doors.create(3300, 486, 'door');
        d2.id = 'door2';

        // Final Relic
        this.relics.create(3450, 500, 'relic');
    }

    createPlatformRect(x, y, widthTiles, heightTiles) {
        for (let w = 0; w < widthTiles; w++) {
            for (let h = 0; h < heightTiles; h++) {
                const tile = this.platforms.create(x + (w * 32), y + (h * 32), 'tile_ground');
                tile.refreshBody();
            }
        }
    }

    createPlayer() {
        this.player = this.physics.add.sprite(this.respawnPoint.x, this.respawnPoint.y, 'player_idle');
        this.player.setCollideWorldBounds(true);
        this.player.setGravityY(750);
        this.player.body.setSize(18, 28);
        this.player.body.setOffset(3, 4);

        // Controller Dynamics State Engine
        this.playerState = {
            isGrounded: false,
            isRolling: false,
            isCrouching: false,
            isWallSliding: false,
            canDoubleJump: false,
            facing: 'right'
        };
    }

    createUI() {
        this.uiContainer = this.add.container(16, 16).setScrollFactor(0);
        
        const uiBg = this.add.graphics();
        uiBg.fillStyle(0x000000, 0.6);
        uiBg.fillRoundedRect(0, 0, 220, 60, 8);
        this.uiContainer.add(uiBg);

        this.relicText = this.add.text(12, 12, `Relics Discovered: 0 / ${this.totalRelics}`, {
            fontSize: '14px',
            color: '#ffd700'
        });
        
        this.zoneText = this.add.text(12, 34, 'Area: Ancient Ruins', {
            fontSize: '12px',
            color: '#20b2aa'
        });

        this.uiContainer.add(this.relicText);
        this.uiContainer.add(this.zoneText);
    }

    update() {
        if (!this.player || !this.player.body) return;

        const onFloor = this.player.body.blocked.down || this.player.body.touching.down;
        const onWallLeft = this.player.body.blocked.left;
        const onWallRight = this.player.body.blocked.right;

        // Input Polling
        const left = this.cursors.left.isDown || this.keys.a.isDown;
        const right = this.cursors.right.isDown || this.keys.d.isDown;
        const jump = Phaser.Input.Keyboard.JustDown(this.cursors.up) || Phaser.Input.Keyboard.JustDown(this.keys.w) || Phaser.Input.Keyboard.JustDown(this.cursors.space);
        const crouch = this.cursors.down.isDown || this.keys.s.isDown;
        const roll = Phaser.Input.Keyboard.JustDown(this.keys.shift);

        // --- 1. HORIZONTAL MOVEMENT ENGINE ---
        let targetSpeed = 0;
        const moveSpeed = 210;
        const accel = onFloor ? 0.2 : 0.1;

        if (left) {
            targetSpeed = -moveSpeed;
            this.player.setFlipX(true);
            this.playerState.facing = 'left';
        } else if (right) {
            targetSpeed = moveSpeed;
            this.player.setFlipX(false);
            this.playerState.facing = 'right';
        }

        if (!this.playerState.isRolling) {
            this.player.setVelocityX(Phaser.Math.Linear(this.player.body.velocity.x, targetSpeed, accel));
        }

        // Footstep Audio Trigger
        if (onFloor && Math.abs(this.player.body.velocity.x) > 50 && Math.random() < 0.1) {
            audioSynth.playStepSFX();
        }

        // --- 2. JUMPING & WALL MOVEMENT ---
        if (onFloor) {
            this.playerState.isGrounded = true;
            this.playerState.canDoubleJump = true;
            this.playerState.isWallSliding = false;
        } else {
            this.playerState.isGrounded = false;
        }

        // Wall Slide Mechanism
        if ((onWallLeft || onWallRight) && !onFloor && this.player.body.velocity.y > 0) {
            this.playerState.isWallSliding = true;
            this.player.setVelocityY(80); // Terminal slide velocity limit
        } else {
            this.playerState.isWallSliding = false;
        }

        // Jump Execution
        if (jump) {
            if (onFloor) {
                // Standard Jump
                this.player.setVelocityY(-360);
                audioSynth.playJumpSFX();
            } else if (this.playerState.isWallSliding) {
                // Wall Jump Push-off
                this.player.setVelocityY(-340);
                this.player.setVelocityX(onWallLeft ? 240 : -240);
                audioSynth.playJumpSFX();
            } else if (this.playerState.canDoubleJump) {
                // Mid-air Jump
                this.player.setVelocityY(-300);
                this.playerState.canDoubleJump = false;
                audioSynth.playJumpSFX();
            }
        }

        // --- 3. ROLLING MECHANIC ---
        if (roll && onFloor && !this.playerState.isRolling) {
            this.playerState.isRolling = true;
            const rollDir = this.playerState.facing === 'right' ? 1 : -1;
            this.player.setVelocityX(rollDir * 350);
            
            // Temporary Scale Squash
            this.player.setScale(1, 0.5);

            this.time.delayedCall(350, () => {
                this.playerState.isRolling = false;
                this.player.setScale(1, 1);
            });
        }

        // --- 4. AREA TRACKING & UI UPDATES ---
        if (this.player.x > 2900) {
            this.zoneText.setText('Area: Sanctuary Solstice');
        } else if (this.player.x > 1900) {
            this.zoneText.setText('Area: Forgotten City');
        } else if (this.player.x > 1000) {
            this.zoneText.setText('Area: Underground Temple');
        } else {
            this.zoneText.setText('Area: Ancient Ruins');
        }

        // Pit Fall Check
        if (this.player.y > 750) {
            this.playerDeath();
        }
    }

    handleMovingPlatform(player, platform) {
        // Keeps player locked on moving platform
    }

    collectRelic(player, relic) {
        relic.destroy();
        this.relicsCollected++;
        audioSynth.playRelicSFX();
        this.relicText.setText(`Relics Discovered: ${this.relicsCollected} / ${this.totalRelics}`);

        if (this.relicsCollected === this.totalRelics) {
            this.triggerGameCompletion();
        }
    }

    activateSwitch(player, sw) {
        if (sw.activated) return;
        sw.activated = true;
        sw.setTexture('switch_on');
        audioSynth.playSwitchSFX();

        // Open linked door
        this.doors.children.iterate((door) => {
            if (door && door.id === sw.id) {
                this.tweens.add({
                    targets: door,
                    y: door.y - 80,
                    alpha: 0.2,
                    duration: 1000,
                    onComplete: () => door.destroy()
                });
            }
        });
    }

    reachCheckpoint(player, checkpoint) {
        this.respawnPoint = { x: checkpoint.x, y: checkpoint.y - 10 };
        checkpoint.setTint(0x00ffcc);
    }

    playerDeath() {
        this.cameras.main.shake(150, 0.01);
        this.player.setPosition(this.respawnPoint.x, this.respawnPoint.y);
        this.player.setVelocity(0, 0);
    }

    triggerGameCompletion() {
        const { width, height } = this.scale;
        
        const overlay = this.add.graphics().setScrollFactor(0);
        overlay.fillStyle(0x000000, 0.85);
        overlay.fillRect(0, 0, width, height);

        this.add.text(width / 2, height / 2 - 40, 'TEMPLE DISCOVERED COMPLETE', {
            fontSize: '32px',
            color: '#ffd700',
            fontStyle: 'bold'
        }).setOrigin(0.5).setScrollFactor(0);

        this.add.text(width / 2, height / 2 + 20, 'You recovered all ancient relics of Aethelgard.', {
            fontSize: '18px',
            color: '#20b2aa'
        }).setOrigin(0.5).setScrollFactor(0);
    }
}

// ============================================================================
// GAME CONFIGURATION & BOOTSTRAP
// ============================================================================
const config = {
    type: Phaser.AUTO,
    width: 960,
    height: 540,
    parent: 'game-container',
    pixelArt: true,
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 0 },
            debug: false
        }
    },
    scene: [BootScene, MainMenuScene, LevelScene]
};

const game = new Phaser.Game(config);
</script>
</body>
</html>
